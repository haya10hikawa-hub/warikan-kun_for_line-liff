<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warikan-kun LIFF Launcher</title>
    <link rel="stylesheet" href="./assets/app.css" />
  </head>
  <body>
    <main class="app-shell liff-mobile-app launcher-app">
      <section class="screen-header is-proposal">
        <div class="screen-header-main">
          <img class="screen-logo" src="./assets/warikan-kun-logo.png" alt="割り勘くん ロゴ" />
          <div class="screen-copy">
            <span class="screen-label">Warikan-kun</span>
            <h1>LINE共同購入</h1>
            <p>必要な画面だけ開きます。</p>
          </div>
        </div>
      </section>

      <section class="content-stack">
        <article class="panel launcher-panel">
          <span class="micro-label">入口</span>
          <h2>使う画面を選ぶ</h2>
          <div class="launcher-actions">
            <a class="primary-cta" href="./proposal.html">募集を開始する</a>
            <a class="ghost-button" href="./apply.html?managementId=WK-DEMO-0001">その他数量を開く</a>
          </div>
          <p class="hint">参加者の通常応募はLINEグループ内で完了します。</p>
        </article>
      </section>
    </main>
  </body>
</html>
